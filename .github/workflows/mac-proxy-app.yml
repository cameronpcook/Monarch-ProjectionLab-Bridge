name: Build Mac proxy app

# Runs when the proxy or app code changes (build + smoke test only),
# manually from the Actions tab, or on a tag like "proxy-v1.0.0" - a tag
# also publishes a GitHub Release with the downloadable zips.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["proxy-v*"]
    paths:            # ignored for tag pushes
      - "mac-proxy-app/**"
      - "Monarch API/**"
      - ".github/workflows/mac-proxy-app.yml"

permissions:
  contents: write   # needed to create the release on tag pushes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon (arm64)
          - runner: macos-15-intel  # Intel (x86_64)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build app
        env:
          PYTHON: python
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/proxy-v') && github.ref_name || '0.0.0' }}
        run: |
          APP_VERSION="${APP_VERSION#proxy-v}" ./mac-proxy-app/build.sh

      - name: Smoke test - app starts and answers on port 47821
        run: |
          "mac-proxy-app/dist/Monarch Bridge Proxy.app/Contents/MacOS/Monarch Bridge Proxy" &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:47821/auth/status; then echo; echo "OK"; kill $APP_PID; exit 0; fi
            sleep 1
          done
          echo "Proxy did not respond. Log:"; cat ~/Library/Logs/"Monarch Bridge Proxy"/proxy.log || true
          kill $APP_PID || true
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: mac-proxy-${{ matrix.runner }}
          path: mac-proxy-app/dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/proxy-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Monarch Bridge Proxy ${{ github.ref_name }}
          files: zips/*.zip
          body: |
            Menu-bar Mac app that runs the local Monarch proxy - no Docker needed.

            - **Apple Silicon (M1/M2/M3/M4…):** `Monarch-Bridge-Proxy-macOS-arm64.zip`
            - **Intel Mac:** `Monarch-Bridge-Proxy-macOS-x86_64.zip`

            Setup instructions: see `mac-proxy-app/README.md`.
